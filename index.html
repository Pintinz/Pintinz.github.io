<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerOS</title>
  <meta name="description" content="CareerOS: find jobs, internships, graduate programmes and scholarships, prepare for interviews and track your applications.">
  <style>
    :root { --ink: #0F172A; --slate: #475569; --blue: #1D5FD1; --bg: #F5F7FB; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 640px; margin: 0 auto; padding: 72px 20px; }
    h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { color: var(--slate); font-size: 18px; line-height: 1.6; margin: 0 0 28px; }
    a.button { display: inline-block; background: var(--blue); color: #fff; text-decoration: none; font-weight: 600; padding: 14px 22px; border-radius: 12px; }
    footer { margin-top: 56px; font-size: 14px; color: var(--slate); }
  </style>
</head>
<body>
  <main>
    <h1>CareerOS</h1>
    <p>Find jobs, internships, graduate programmes and scholarships. Prepare for interviews, improve your CV and track every application in one place.</p>
    <a class="button" href="https://play.google.com/store/apps/details?id=com.careeros.careeros">Get it on Google Play</a>
    <footer>&copy; 2026 CareerOS</footer>
  </main>
</body>
</html>
